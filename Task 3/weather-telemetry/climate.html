<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate · Weather Telemetry</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-root"></div>

<main class="container">
  <h1 class="page-title">Climate Telemetry</h1>

  <form class="search" id="searchForm">
    <input id="cityInput" type="text" placeholder="Search any city" autocomplete="off" required>
    <button type="submit" id="searchBtn">Search</button>
    <button type="button" id="geoBtn" class="icon-btn" title="Use my location" aria-label="Use my location">📍</button>
  </form>
  <div class="chips" id="recent"></div>

  <div class="spinner hidden" id="spinner" role="status" aria-label="Loading"></div>
  <div class="error hidden" id="error" role="alert"></div>
  <div class="notice hidden" id="notice"></div>

  <section id="result" class="hidden">
    <div class="card place">
      <h2 id="place"></h2>
      <p id="placeSub"></p>
    </div>

    <div class="card">
      <h3>Air Quality</h3>
      <div id="airBox"></div>
    </div>

    <div class="card">
      <h3>5-Day Climate Statistics</h3>
      <div class="metrics" id="stats"></div>
    </div>
  </section>
</main>

<footer class="footer">Data from OpenWeatherMap · Weather Telemetry</footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/climate.js"></script>
</body>
</html>

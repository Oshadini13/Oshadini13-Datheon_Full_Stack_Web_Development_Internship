<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow - Task Manager & Productivity Tracker</title>
<style>
:root{
  --bg:#f3f4f8; --card:#ffffff; --text:#1f2430; --muted:#7a8194; --line:#e6e8ef;
  --primary:#5b6cff; --primary-d:#4654e0; --ok:#22b07d; --danger:#ef4f5f; --warn:#f59e0b;
  --work:#5b6cff; --personal:#ec4899; --study:#14b8a6; --other:#8b5cf6;
  --shadow:0 6px 24px rgba(30,40,80,.08); --radius:14px;
}
[data-theme="dark"]{
  --bg:#12141c; --card:#1b1e29; --text:#e8eaf2; --muted:#8c93a8; --line:#2a2e3d;
  --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{margin:0;font-size:1.7rem;letter-spacing:-.5px}
h1 span{color:var(--primary)}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:1rem;box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{text-align:center;padding:10px 4px;border-radius:12px;background:var(--bg)}
.stat b{display:block;font-size:1.4rem}
.stat small{color:var(--muted);font-size:.75rem}
.progress{height:10px;background:var(--bg);border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--ok));border-radius:99px;transition:width .5s ease}
.pmeta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px}

/* form */
form.add{display:grid;grid-template-columns:1fr auto auto auto;gap:8px}
input,select,button{font:inherit}
input[type=text],input[type=date],select,textarea{
  padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,108,255,.18)}
.btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:600;transition:background .2s,transform .1s}
.btn:hover{background:var(--primary-d)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--danger);border-color:var(--danger);background:transparent}
.err{color:var(--danger);font-size:.82rem;margin-top:6px;min-height:1em}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600}
.tab.active{background:var(--card);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input[type=text]{width:170px;padding:8px 12px}
.tools select{padding:8px 10px}

/* list */
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cat,var(--primary));border-radius:12px;box-shadow:var(--shadow);transition:transform .2s,opacity .25s,background .2s;animation:slideIn .3s ease}
.task[draggable=true]{cursor:grab}
.task.dragging{opacity:.4}
.task.over{border-top:3px solid var(--primary)}
.task.removing{opacity:0;transform:translateX(40px) scale(.95)}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task.done{background:var(--bg)}
.task.just-done{animation:pop .5s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.04);box-shadow:0 0 0 6px rgba(34,176,125,.25)}100%{transform:scale(1)}}
.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:50%;cursor:pointer;flex:none;position:relative;transition:all .25s}
.check:hover{border-color:var(--ok)}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);animation:tick .3s ease}
@keyframes tick{from{opacity:0;transform:rotate(45deg) scale(.3)}to{opacity:1;transform:rotate(45deg) scale(1)}}
.body{flex:1;min-width:0}
.title{font-weight:600;word-break:break-word;transition:color .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;font-size:.78rem;color:var(--muted)}
.badge{padding:2px 9px;border-radius:99px;color:#fff;font-weight:600;font-size:.72rem;background:var(--cat)}
.due.overdue{color:var(--danger);font-weight:700}
.due.today{color:var(--warn);font-weight:700}
.actions{display:flex;gap:4px}
.actions button{background:transparent;border:0;cursor:pointer;font-size:1.05rem;padding:6px 8px;border-radius:8px;color:var(--muted);transition:background .2s}
.actions button:hover{background:var(--bg);color:var(--text)}
.actions .del:hover{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .big{font-size:2.4rem}
.hint{color:var(--muted);font-size:.78rem;text-align:center;margin-top:12px}

/* dialog */
dialog{border:0;border-radius:var(--radius);padding:22px;background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(440px,92vw)}
dialog::backdrop{background:rgba(10,12,20,.55)}
dialog h3{margin:0 0 14px}
dialog .row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
dialog label{font-size:.8rem;color:var(--muted);font-weight:600}
dialog input,dialog select{width:100%}
dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

@media(max-width:620px){
  form.add{grid-template-columns:1fr 1fr}
  form.add input[type=text]{grid-column:1/-1}
  form.add .btn{grid-column:1/-1}
  .stats{grid-template-columns:repeat(2,1fr)}
  .tools input[type=text]{width:100%;flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Task<span>Flow</span></h1>
      <div class="sub" id="today"></div>
    </div>
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode">🌙</button>
  </header>

  <section class="card">
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><small>Total</small></div>
      <div class="stat"><b id="sActive">0</b><small>Active</small></div>
      <div class="stat"><b id="sDone">0</b><small>Completed</small></div>
      <div class="stat"><b id="sOver" style="color:var(--danger)">0</b><small>Overdue</small></div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="pmeta"><span>Productivity</span><span id="pct">0%</span></div>
  </section>

  <section class="card">
    <form class="add" id="addForm" autocomplete="off">
      <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="120">
      <select id="catInput" aria-label="Category">
        <option>Work</option><option>Personal</option><option>Study</option><option>Other</option>
      </select>
      <input type="date" id="dateInput" aria-label="Due date">
      <button class="btn" type="submit">+ Add Task</button>
    </form>
    <div class="err" id="err"></div>
  </section>

  <section class="card">
    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab active" data-f="all">All</button>
        <button class="tab" data-f="active">Active</button>
        <button class="tab" data-f="completed">Completed</button>
      </div>
      <div class="tools">
        <input type="text" id="search" placeholder="🔍 Search tasks...">
        <select id="catFilter" aria-label="Filter by category">
          <option value="all">All categories</option>
          <option>Work</option><option>Personal</option><option>Study</option><option>Other</option>
        </select>
        <select id="sortSel" aria-label="Sort">
          <option value="manual">Manual order</option>
          <option value="due">Due date</option>
          <option value="newest">Newest</option>
        </select>
        <button class="btn ghost" id="clearDone">Clear completed</button>
      </div>
    </div>
    <div style="height:14px"></div>
    <ul class="list" id="list"></ul>
    <div class="hint" id="hint">Tip: drag tasks to reorder (Manual order, All categories, no search).</div>
  </section>
</div>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h3>Edit Task</h3>
    <div class="row"><label>Title</label><input type="text" id="eTitle" maxlength="120"></div>
    <div class="row"><label>Category</label>
      <select id="eCat"><option>Work</option><option>Personal</option><option>Study</option><option>Other</option></select></div>
    <div class="row"><label>Due date</label><input type="date" id="eDate"></div>
    <div class="foot">
      <button type="button" class="btn ghost" id="eCancel">Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  "use strict";
  const KEY = "taskflow.tasks.v1", THEME_KEY = "taskflow.theme";
  const COLORS = {Work:"var(--work)", Personal:"var(--personal)", Study:"var(--study)", Other:"var(--other)"};

  /* ---------- state ---------- */
  let tasks = [];
  let filter = "all", catFilter = "all", query = "", sortMode = "manual";
  let justDone = null, dragId = null, editId = null;

  /* ---------- localStorage helpers ---------- */
  function saveToLocalStorage(){
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e){ console.warn("Save failed", e); }
  }
  function loadFromLocalStorage(){
    try {
      const raw = localStorage.getItem(KEY);
      const arr = raw ? JSON.parse(raw) : [];
      tasks = Array.isArray(arr) ? arr : [];
    } catch(e){ tasks = []; }
  }

  /* ---------- utils ---------- */
  const $ = id => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  function dueInfo(t){
    if(!t.due) return null;
    const td = todayStr();
    const d = new Date(t.due + "T00:00:00");
    const label = d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    if(t.done) return {cls:"", text:"📅 " + label};
    if(t.due < td) return {cls:"overdue", text:"⚠ Overdue · " + label};
    if(t.due === td) return {cls:"today", text:"⏰ Due today"};
    return {cls:"", text:"📅 " + label};
  }

  /* ---------- CRUD ---------- */
  function addTask(title, category, due){
    tasks.unshift({id:uid(), title, category, due:due||"", done:false, created:Date.now()});
    saveToLocalStorage(); render();
  }
  function toggleTask(id){
    const t = tasks.find(x => x.id === id); if(!t) return;
    t.done = !t.done;
    justDone = t.done ? id : null;
    saveToLocalStorage(); render();
  }
  function updateTask(id, patch){
    const t = tasks.find(x => x.id === id); if(!t) return;
    Object.assign(t, patch);
    saveToLocalStorage(); render();
  }
  function deleteTask(id){
    const el = document.querySelector('[data-id="'+id+'"]');
    const finish = () => { tasks = tasks.filter(x => x.id !== id); saveToLocalStorage(); render(); };
    if(el){ el.classList.add("removing"); setTimeout(finish, 240); } else finish();
  }

  /* ---------- render ---------- */
  function visibleTasks(){
    let list = tasks.filter(t => {
      if(filter === "active" && t.done) return false;
      if(filter === "completed" && !t.done) return false;
      if(catFilter !== "all" && t.category !== catFilter) return false;
      if(query && !t.title.toLowerCase().includes(query)) return false;
      return true;
    });
    if(sortMode === "due"){
      list = [...list].sort((a,b) => (a.due||"9999") .localeCompare(b.due||"9999"));
    } else if(sortMode === "newest"){
      list = [...list].sort((a,b) => b.created - a.created);
    }
    return list;
  }

  function render(){
    const list = visibleTasks();
    const ul = $("list");
    const canDrag = sortMode === "manual" && catFilter === "all" && !query && filter === "all";
    ul.innerHTML = "";

    if(!list.length){
      const msg = tasks.length ? "No tasks match your filters." : "No tasks yet. Add your first one above!";
      ul.innerHTML = '<li class="empty"><div class="big">🗒️</div>' + msg + '</li>';
    }

    list.forEach(t => {
      const li = document.createElement("li");
      li.className = "task" + (t.done ? " done" : "") + (t.id === justDone ? " just-done" : "");
      li.dataset.id = t.id;
      li.style.setProperty("--cat", COLORS[t.category] || COLORS.Other);
      li.draggable = canDrag;
      const di = dueInfo(t);
      li.innerHTML =
        '<input type="checkbox" class="check" ' + (t.done ? "checked" : "") + ' aria-label="Mark complete">' +
        '<div class="body"><div class="title">' + esc(t.title) + '</div>' +
        '<div class="meta"><span class="badge">' + esc(t.category) + '</span>' +
        (di ? '<span class="due ' + di.cls + '">' + di.text + '</span>' : '') + '</div></div>' +
        '<div class="actions"><button class="edit" title="Edit">✏️</button><button class="del" title="Delete">🗑️</button></div>';

      li.querySelector(".check").addEventListener("change", () => toggleTask(t.id));
      li.querySelector(".edit").addEventListener("click", () => openEdit(t.id));
      li.querySelector(".del").addEventListener("click", () => deleteTask(t.id));
      li.querySelector(".title").addEventListener("dblclick", () => openEdit(t.id));

      if(canDrag){
        li.addEventListener("dragstart", e => { dragId = t.id; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", t.id); });
        li.addEventListener("dragend", () => { dragId = null; li.classList.remove("dragging"); document.querySelectorAll(".over").forEach(x => x.classList.remove("over")); });
        li.addEventListener("dragover", e => { e.preventDefault(); if(dragId && dragId !== t.id) li.classList.add("over"); });
        li.addEventListener("dragleave", () => li.classList.remove("over"));
        li.addEventListener("drop", e => {
          e.preventDefault(); li.classList.remove("over");
          if(!dragId || dragId === t.id) return;
          const from = tasks.findIndex(x => x.id === dragId);
          const [moved] = tasks.splice(from, 1);
          const to = tasks.findIndex(x => x.id === t.id);
          tasks.splice(to, 0, moved);
          saveToLocalStorage(); render();
        });
      }
      ul.appendChild(li);
    });
    justDone = null;
    $("hint").style.display = canDrag && tasks.length > 1 ? "block" : "none";
    updateStats();
  }

  function updateStats(){
    const total = tasks.length, done = tasks.filter(t => t.done).length, td = todayStr();
    const over = tasks.filter(t => !t.done && t.due && t.due < td).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    $("sTotal").textContent = total;
    $("sActive").textContent = total - done;
    $("sDone").textContent = done;
    $("sOver").textContent = over;
    $("bar").style.width = pct + "%";
    $("pct").textContent = pct + "%";
  }

  /* ---------- edit dialog ---------- */
  function openEdit(id){
    const t = tasks.find(x => x.id === id); if(!t) return;
    editId = id;
    $("eTitle").value = t.title; $("eCat").value = t.category; $("eDate").value = t.due || "";
    $("editDlg").showModal(); $("eTitle").focus();
  }
  $("editForm").addEventListener("submit", e => {
    const title = $("eTitle").value.trim();
    if(!title){ e.preventDefault(); $("eTitle").focus(); return; }
    updateTask(editId, {title, category:$("eCat").value, due:$("eDate").value});
  });
  $("eCancel").addEventListener("click", () => $("editDlg").close());

  /* ---------- events ---------- */
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const title = $("taskInput").value.trim();
    if(!title){ $("err").textContent = "Please enter a task title."; $("taskInput").focus(); return; }
    $("err").textContent = "";
    addTask(title, $("catInput").value, $("dateInput").value);
    $("taskInput").value = ""; $("dateInput").value = ""; $("taskInput").focus();
  });
  $("taskInput").addEventListener("input", () => $("err").textContent = "");

  $("tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if(!b) return;
    filter = b.dataset.f;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === b));
    render();
  });
  $("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
  $("catFilter").addEventListener("change", e => { catFilter = e.target.value; render(); });
  $("sortSel").addEventListener("change", e => { sortMode = e.target.value; render(); });
  $("clearDone").addEventListener("click", () => {
    const n = tasks.filter(t => t.done).length;
    if(!n) return;
    if(confirm("Remove " + n + " completed task" + (n > 1 ? "s" : "") + "?")){
      tasks = tasks.filter(t => !t.done); saveToLocalStorage(); render();
    }
  });

  /* ---------- theme ---------- */
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    $("themeBtn").textContent = t === "dark" ? "☀️" : "🌙";
  }
  $("themeBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  });

  /* ---------- init ---------- */
  let savedTheme = "light";
  try { savedTheme = localStorage.getItem(THEME_KEY) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch(e){}
  applyTheme(savedTheme);
  $("today").textContent = new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  loadFromLocalStorage();
  render();
})();
</script>
</body>
</html>
